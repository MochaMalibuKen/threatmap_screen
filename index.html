<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06090d" />
  <title>Global Situational Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.7.1/maplibre-gl.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell ambient">
    <div id="map" class="map"></div>
    <div class="grid-overlay"></div><div class="vignette"></div>
    <div class="brand-mark" aria-hidden="true"><span>V3</span><i></i></div>
    <header id="topHud" class="top-hud"><div class="eyebrow">GLOBAL SITUATIONAL DISPLAY</div><button id="ambientBtn">AMBIENT</button></header>
    <section class="scene-label"><div class="eyebrow">SCENE</div><div id="sceneTitle" class="scene-title">GLOBAL OVERVIEW</div><div id="sceneSubtitle" class="scene-subtitle">LIVE + PERIODIC OPEN-SOURCE SIGNALS</div></section>
    <aside id="sourcePanel" class="source-panel"><div class="eyebrow">DATA LAYERS</div><div id="sourceRows"></div></aside>
    <div id="ambientStatus" class="ambient-status"></div>
    <button id="enterBtn" class="enter-interactive"><span>ENTER</span> INTERACTIVE MODE</button>
    <div id="remoteHelp" class="remote-help"><span>ARROWS PAN</span><span>+ / − ZOOM</span><span>ESC / BACK AMBIENT</span></div>
    <aside id="detailCard" class="detail-card hidden"><button id="closeDetail" class="close">×</button><div id="detailBody"></div></aside>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.7.1/maplibre-gl.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
